<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="物理批改：厚外教学用法示意图，非产品截图">
    <rect width="1200" height="720" fill="#fff9f0"/>
    <rect width="1200" height="14" fill="#69429b"/>
    <g font-family="Microsoft YaHei" fill="#142d43">
    <rect x="48" y="40" width="254" height="38" rx="7" fill="#69429b"/><text x="66" y="67" font-size="21" font-weight="700" fill="white">厚外 · 教学用法示意图</text>
    <text x="1152" y="67" text-anchor="end" font-size="21" fill="#344e65">A367 · 数学与科学</text>
    <text x="48" y="139" font-size="40" font-weight="700" fill="#142d43">物理批改</text>
    <text x="48" y="218" font-size="23" font-weight="700" fill="#69429b">小学 / 初中 / 高中 · 先做一项任务，再看学习变化</text>
    <g><rect x="48" y="255" width="348" height="318" rx="18" fill="#ffffff" stroke="#69429b" stroke-width="2.5"/>
        <rect x="48" y="255" width="348" height="72" rx="18" fill="#69429b"/><rect x="48" y="291" width="348" height="36" fill="#69429b"/>
        <circle cx="85" cy="291" r="18" fill="white"/>
        <text x="85" y="298" text-anchor="middle" font-size="22" font-weight="700" fill="#69429b">1</text>
        <text x="117" y="299" font-size="26" font-weight="700" fill="white">教师先做</text>
        <text x="72" y="373" font-size="26" font-weight="400" fill="#142d43">抽核识别和判定，确认反</text><text x="72" y="412" font-size="26" font-weight="400" fill="#142d43">馈后再使用</text>
        </g><path d="M401 405 H415 M408 397 L416 405 L408 413" fill="none" stroke="#69429b" stroke-width="3"/><g><rect x="420" y="255" width="348" height="318" rx="18" fill="#ffffff" stroke="#69429b" stroke-width="2.5"/>
        <rect x="420" y="255" width="348" height="72" rx="18" fill="#69429b"/><rect x="420" y="291" width="348" height="36" fill="#69429b"/>
        <circle cx="457" cy="291" r="18" fill="white"/>
        <text x="457" y="298" text-anchor="middle" font-size="22" font-weight="700" fill="#69429b">2</text>
        <text x="489" y="299" font-size="26" font-weight="700" fill="white">学生行动</text>
        <text x="444" y="373" font-size="26" font-weight="400" fill="#142d43">按错因订正，并独立做一</text><text x="444" y="412" font-size="26" font-weight="400" fill="#142d43">道同目标题</text>
        </g><path d="M773 405 H787 M780 397 L788 405 L780 413" fill="none" stroke="#69429b" stroke-width="3"/><g><rect x="792" y="255" width="348" height="318" rx="18" fill="#ffffff" stroke="#69429b" stroke-width="2.5"/>
        <rect x="792" y="255" width="348" height="72" rx="18" fill="#69429b"/><rect x="792" y="291" width="348" height="36" fill="#69429b"/>
        <circle cx="829" cy="291" r="18" fill="white"/>
        <text x="829" y="298" text-anchor="middle" font-size="22" font-weight="700" fill="#69429b">3</text>
        <text x="861" y="299" font-size="26" font-weight="700" fill="white">留下什么</text>
        <text x="816" y="373" font-size="26" font-weight="400" fill="#142d43">原作答、识别结果、候选</text><text x="816" y="412" font-size="26" font-weight="400" fill="#142d43">评分与教师复核记录</text>
        </g>
    <g transform="translate(48,608) scale(.75)"><g fill="none" stroke="#69429b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><circle cx="42" cy="30" r="25"/><path d="M17 30 H67 M42 5 C24 19 24 41 42 55 M42 5 C60 19 60 41 42 55 M22 16 H62 M22 44 H62"/></g></g>
    <text x="126" y="630" font-size="22" font-weight="700" fill="#69429b">建议改造流程 · 教师审定后使用</text>
