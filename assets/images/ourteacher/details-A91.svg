    <text x="1152" y="67" text-anchor="end" font-size="21" fill="#344e65">A91 · 教学图文与媒体</text>
    <text x="48" y="139" font-size="40" font-weight="700" fill="#142d43">生成视频</text>
    <text x="48" y="218" font-size="23" font-weight="700" fill="#176537">幼儿园 / 小学 / 初中 / 高中 · 先做一项任务，再看学习变化</text>
    <g><rect x="48" y="255" width="348" height="318" rx="18" fill="#ffffff" stroke="#176537" stroke-width="2.5"/>
