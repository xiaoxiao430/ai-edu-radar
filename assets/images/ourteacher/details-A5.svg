<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="跨学科设计：厚外教学用法示意图，非产品截图">
    <rect width="1200" height="720" fill="#fff9f0"/>
    <rect width="1200" height="14" fill="#176537"/>
    <g font-family="Microsoft YaHei" fill="#142d43">
    <rect x="48" y="40" width="254" height="38" rx="7" fill="#176537"/><text x="66" y="67" font-size="21" font-weight="700" fill="white">厚外 · 教学用法示意图</text>
    <text x="1152" y="67" text-anchor="end" font-size="21" fill="#344e65">A5 · 地理与历史</text>
    <text x="48" y="139" font-size="40" font-weight="700" fill="#142d43">跨学科设计</text>
    <text x="48" y="218" font-size="23" font-weight="700" fill="#176537">小学 / 初中 / 高中 · 先做一项任务，再看学习变化</text>
    <g><rect x="48" y="255" width="348" height="318" rx="18" fill="#ffffff" stroke="#176537" stroke-width="2.5"/>
        <rect x="48" y="255" width="348" height="72" rx="18" fill="#176537"/><rect x="48" y="291" width="348" height="36" fill="#176537"/>
        <circle cx="85" cy="291" r="18" fill="white"/>
        <text x="85" y="298" text-anchor="middle" font-size="22" font-weight="700" fill="#176537">1</text>
        <text x="117" y="299" font-size="26" font-weight="700" fill="white">教师先做</text>
        <text x="72" y="373" font-size="26" font-weight="400" fill="#142d43">限定问题与周期，明确各</text><text x="72" y="412" font-size="26" font-weight="400" fill="#142d43">学科任务和验收标准</text>
        </g><path d="M401 405 H415 M408 397 L416 405 L408 413" fill="none" stroke="#176537" stroke-width="3"/><g><rect x="420" y="255" width="348" height="318" rx="18" fill="#ffffff" stroke="#176537" stroke-width="2.5"/>
        <rect x="420" y="255" width="348" height="72" rx="18" fill="#176537"/><rect x="420" y="291" width="348" height="36" fill="#176537"/>
        <circle cx="457" cy="291" r="18" fill="white"/>
        <text x="457" y="298" text-anchor="middle" font-size="22" font-weight="700" fill="#176537">2</text>
        <text x="489" y="299" font-size="26" font-weight="700" fill="white">学生行动</text>
        <text x="444" y="373" font-size="26" font-weight="400" fill="#142d43">分工探究、制作并根据使</text><text x="444" y="412" font-size="26" font-weight="400" fill="#142d43">用反馈修改作品</text>
        </g><path d="M773 405 H787 M780 397 L788 405 L780 413" fill="none" stroke="#176537" stroke-width="3"/><g><rect x="792" y="255" width="348" height="318" rx="18" fill="#ffffff" stroke="#176537" stroke-width="2.5"/>
        <rect x="792" y="255" width="348" height="72" rx="18" fill="#176537"/><rect x="792" y="291" width="348" height="36" fill="#176537"/>
        <circle cx="829" cy="291" r="18" fill="white"/>
        <text x="829" y="298" text-anchor="middle" font-size="22" font-weight="700" fill="#176537">3</text>
        <text x="861" y="299" font-size="26" font-weight="700" fill="white">留下什么</text>
        <text x="816" y="373" font-size="26" font-weight="400" fill="#142d43">问题驱动任务、分工、作</text><text x="816" y="412" font-size="26" font-weight="400" fill="#142d43">品要求、过程记录与评价</text><text x="816" y="451" font-size="26" font-weight="400" fill="#142d43">单</text>
        </g>
    <g transform="translate(48,608) scale(.75)"><g fill="none" stroke="#176537" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><circle cx="42" cy="30" r="25"/><path d="M17 30 H67 M42 5 C24 19 24 41 42 55 M42 5 C60 19 60 41 42 55 M22 16 H62 M22 44 H62"/></g></g>
    <text x="126" y="630" font-size="22" font-weight="700" fill="#176537">建议改造流程 · 教师审定后使用</text>
    <text x="48" y="685" font-size="21" fill="#344e65">依据公开名称与教学建议绘制，非 OurTeacher 操作截图</text>
    <text x="1152" y="685" text-anchor="end" font-size="21" font-weight="700" fill="#176537">内部界面待补</text>
    </g></svg>