<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="成绩看板：厚外教学用法示意图，非产品截图">
    <rect width="1200" height="720" fill="#fff9f0"/>
    <rect width="1200" height="14" fill="#9c3a13"/>
    <g font-family="Microsoft YaHei" fill="#142d43">
    <rect x="48" y="40" width="254" height="38" rx="7" fill="#9c3a13"/><text x="66" y="67" font-size="21" font-weight="700" fill="white">厚外 · 教学用法示意图</text>
    <text x="1152" y="67" text-anchor="end" font-size="21" fill="#344e65">A217 · 学情与自主学习</text>
    <text x="48" y="139" font-size="40" font-weight="700" fill="#142d43">成绩看板</text>
    <text x="48" y="218" font-size="23" font-weight="700" fill="#9c3a13">小学 / 初中 / 高中 · 先做一项任务，再看学习变化</text>
    <g><rect x="48" y="255" width="348" height="318" rx="18" fill="#ffffff" stroke="#9c3a13" stroke-width="2.5"/>
        <rect x="48" y="255" width="348" height="72" rx="18" fill="#9c3a13"/><rect x="48" y="291" width="348" height="36" fill="#9c3a13"/>
        <circle cx="85" cy="291" r="18" fill="white"/>
        <text x="85" y="298" text-anchor="middle" font-size="22" font-weight="700" fill="#9c3a13">1</text>
        <text x="117" y="299" font-size="26" font-weight="700" fill="white">教师先做</text>
        <text x="72" y="373" font-size="26" font-weight="400" fill="#142d43">核对统计口径，结合原始</text><text x="72" y="412" font-size="26" font-weight="400" fill="#142d43">作答定位薄弱目标</text>
        </g><path d="M401 405 H415 M408 397 L416 405 L408 413" fill="none" stroke="#9c3a13" stroke-width="3"/><g><rect x="420" y="255" width="348" height="318" rx="18" fill="#ffffff" stroke="#9c3a13" stroke-width="2.5"/>
        <rect x="420" y="255" width="348" height="72" rx="18" fill="#9c3a13"/><rect x="420" y="291" width="348" height="36" fill="#9c3a13"/>
        <circle cx="457" cy="291" r="18" fill="white"/>
        <text x="457" y="298" text-anchor="middle" font-size="22" font-weight="700" fill="#9c3a13">2</text>
        <text x="489" y="299" font-size="26" font-weight="700" fill="white">学生行动</text>
        <text x="444" y="373" font-size="26" font-weight="400" fill="#142d43">回看错因，选择对应补练</text><text x="444" y="412" font-size="26" font-weight="400" fill="#142d43">并再次独立检查</text>
        </g><path d="M773 405 H787 M780 397 L788 405 L780 413" fill="none" stroke="#9c3a13" stroke-width="3"/><g><rect x="792" y="255" width="348" height="318" rx="18" fill="#ffffff" stroke="#9c3a13" stroke-width="2.5"/>
        <rect x="792" y="255" width="348" height="72" rx="18" fill="#9c3a13"/><rect x="792" y="291" width="348" height="36" fill="#9c3a13"/>
        <circle cx="829" cy="291" r="18" fill="white"/>
        <text x="829" y="298" text-anchor="middle" font-size="22" font-weight="700" fill="#9c3a13">3</text>
        <text x="861" y="299" font-size="26" font-weight="700" fill="white">留下什么</text>
        <text x="816" y="373" font-size="26" font-weight="400" fill="#142d43">可复算的统计表、薄弱目</text><text x="816" y="412" font-size="26" font-weight="400" fill="#142d43">标与分组补练安排</text>
        </g>
    <g transform="translate(48,608) scale(.75)"><g fill="none" stroke="#9c3a13" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8 H61 L72 19 V55 H12 Z M61 8 V19 H72 M24 44 V34 M38 44 V25 M52 44 V30 M20 49 H61"/></g></g>
    <text x="126" y="630" font-size="22" font-weight="700" fill="#9c3a13">建议改造流程 · 教师审定后使用</text>
    <text x="48" y="685" font-size="21" fill="#344e65">依据公开名称与教学建议绘制，非 OurTeacher 操作截图</text>
    <text x="1152" y="685" text-anchor="end" font-size="21" font-weight="700" fill="#9c3a13">内部界面待补</text>
