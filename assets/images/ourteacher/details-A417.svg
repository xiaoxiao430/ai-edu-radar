        <text x="72" y="373" font-size="26" font-weight="400" fill="#142d43">设定完成标准，核对状态</text><text x="72" y="412" font-size="26" font-weight="400" fill="#142d43">并安排支持</text>
        </g><path d="M401 405 H415 M408 397 L416 405 L408 413" fill="none" stroke="#bd2035" stroke-width="3"/><g><rect x="420" y="255" width="348" height="318" rx="18" fill="#ffffff" stroke="#bd2035" stroke-width="2.5"/>
