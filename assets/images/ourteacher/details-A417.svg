        <text x="489" y="299" font-size="26" font-weight="700" fill="white">学生行动</text>
        <text x="444" y="373" font-size="26" font-weight="400" fill="#142d43">提交真实任务，根据反馈</text><text x="444" y="412" font-size="26" font-weight="400" fill="#142d43">补充或修改</text>
        </g><path d="M773 405 H787 M780 397 L788 405 L780 413" fill="none" stroke="#bd2035" stroke-width="3"/><g><rect x="792" y="255" width="348" height="318" rx="18" fill="#ffffff" stroke="#bd2035" stroke-width="2.5"/>
