<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" rx="24" fill="#fff8ec"/><g font-family="Microsoft YaHei,微软雅黑,sans-serif"><rect x="40" y="32" width="1120" height="70" rx="14" fill="#8b1734"/><text x="66" y="77" font-size="29" font-weight="700" fill="white">Vosk · 把一次口头复述变成可订正的学习记录</text><text x="54" y="139" font-size="21" fill="#66352d">教学用法示意图 · 非产品截图 · 内部界面待补</text><rect x="44" y="168" width="534" height="340" rx="18" fill="white" stroke="#d5b6a0"/><text x="70" y="211" font-size="24" fill="#34232a" font-weight="700">01 先保留学生真正说过的话</text><rect x="68" y="234" width="486" height="86" rx="12" fill="#fff1d5"/><path d="M88 276h30m8-17v34m14-49v64m14-81v96m14-67v41m14-25v14m14-39v61m14-79v99m14-67v40m14-24v10m14-49v85m14-66v48m14-26v10m14-41v69m14-84v101m14-70v40m14-24v10m14-30v50m14-64v80m14-51v25m14-14h35" stroke="#aa6a00" stroke-width="6" stroke-linecap="round"/><text x="72" y="359" font-size="22" fill="#34232a">短录音 → 本地候选转写</text><text x="72" y="400" font-size="20" fill="#54434d">保留音频，允许逐句回放与修改</text><text x="72" y="443" font-size="20" fill="#54434d">识别错误 ≠ 学生的表达错误</text><text x="72" y="483" font-size="18" fill="#8b1734">不把识别率直接当作口语成绩</text><rect x="600" y="168" width="556" height="340" rx="18" fill="white" stroke="#d5b6a0"/><text x="628" y="211" font-size="24" fill="#34232a" font-weight="700">02 教师确认反馈，学生再次表达</text><rect x="624" y="234" width="508" height="124" rx="12" fill="#f0f6f3"/><text x="648" y="271" font-size="21" fill="#225344">□ 信息有没有遗漏？</text><text x="648" y="306" font-size="21" fill="#225344">□ 依据与解释是否对应？</text><text x="648" y="341" font-size="21" fill="#225344">□ 这次只改进哪一到两点？</text><text x="630" y="401" font-size="22" fill="#34232a">教师复核 → 修改准备 → 再次口述</text><text x="630" y="444" font-size="20" fill="#54434d">保存前后版本与学生的改进说明</text><text x="630" y="483" font-size="18" fill="#8b1734">人工反馈量规需先在真实课例中验证</text><rect x="44" y="538" width="1112" height="130" rx="18" fill="#ffffff" stroke="#d5b6a0"/><text x="70" y="579" font-size="23" font-weight="700" fill="#8b1734">与厚外已有入口衔接</text><text x="70" y="619" font-size="21" fill="#34232a">班务屏发任务 ｜ 学科页完成与订正 ｜ 成长记录接教师确认的作品</text><text x="70" y="650" font-size="18" fill="#54434d">示例流程，不代表原项目已提供完整教学界面或本校已完成部署。</text></g></svg>