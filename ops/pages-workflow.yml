name: 发布教育项目精选库

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 读取仓库
        uses: actions/checkout@v7
      - name: 准备 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: 检查公开数据
        run: |
          node scripts/test-validator.mjs
          node scripts/validate.mjs
      - name: 制作离线快照与网站文件
        run: node scripts/build-snapshot.mjs
      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v6
      - name: 上传网站文件
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          include-hidden-files: true
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 发布网站
        id: deployment
        uses: actions/deploy-pages@v5

